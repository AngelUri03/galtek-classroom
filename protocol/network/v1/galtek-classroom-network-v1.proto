syntax = "proto3";

package galtek.classroom.network.v1;

option csharp_namespace = "GaltekClassroom.Protocol.Network.V1";
option java_multiple_files = true;
option java_package = "com.galtek.classroom.network.v1";

service NetworkConnection {
  rpc Connect(stream ClientEnvelope) returns (stream MasterEnvelope);
}

message ClientEnvelope {
  string protocol_version = 1;

  oneof payload {
    ClientHello client_hello = 10;
    Heartbeat heartbeat = 11;
    OperationAccepted operation_accepted = 12;
    OperationResult operation_result = 13;
    OperationStatusReport operation_status_report = 14;
  }
}

message MasterEnvelope {
  string protocol_version = 1;

  oneof payload {
    ConnectionStatus connection_status = 10;
    HeartbeatAck heartbeat_ack = 11;
    OperationRequest operation_request = 12;
    OperationStatusQuery operation_status_query = 13;
  }
}

message ClientHello {
  string client_network_identity_id = 1;
  string client_installation_id = 2;
  string client_public_key_fingerprint = 3;
  string client_public_key_subject_public_key_info_base64 = 4;
  string device_id = 5;
  string display_name = 6;
  string hostname = 7;
  int64 sent_at_unix_ms = 8;
  repeated NetworkCapability capabilities = 9;
  string agent_version = 10;
}

message Heartbeat {
  string heartbeat_id = 1;
  int64 sent_at_unix_ms = 2;
}

message HeartbeatAck {
  string heartbeat_id = 1;
  string client_network_identity_id = 2;
  int64 received_at_unix_ms = 3;
  ConnectionState status = 4;
}

message ConnectionStatus {
  string client_network_identity_id = 1;
  ConnectionState status = 2;
  string reason_code = 3;
  string message = 4;
  int64 server_time_unix_ms = 5;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_CONNECTING = 1;
  CONNECTION_STATE_ONLINE = 2;
  CONNECTION_STATE_OFFLINE = 3;
  CONNECTION_STATE_REJECTED = 4;
}

message OperationRequest {
  string operation_id = 1;
  NetworkOperationType operation_type = 2;
  string target_device_id = 3;
  string protocol_version = 4;
  int64 sent_at_unix_ms = 5;
  int64 timeout_ms = 6;

  oneof operation_parameters {
    OpenUrlOperationParameters open_url = 20;
    ApplyBrowserPolicyOperationParameters apply_browser_policy = 21;
    ApplyBrowserDownloadPolicyOperationParameters apply_browser_download_policy = 22;
    OpenApplicationOperationParameters open_application = 23;
    ProvisionManagedCredentialOperationParameters provision_managed_credential = 24;
    LogoffWindowsSessionOperationParameters logoff_windows_session = 25;
    LogonManagedAccountOperationParameters logon_managed_account = 26;
  }
}

message LogonManagedAccountOperationParameters {
  ManagedWindowsAccountId account_id = 1;
}

message LogoffWindowsSessionOperationParameters {
  ManagedWindowsAccountId account_id = 1;
}

message ProvisionManagedCredentialOperationParameters {
  ManagedWindowsAccountId account_id = 1;
  bytes password_utf16le = 2;
}

message OpenApplicationOperationParameters {
  string application_id = 1;
}

message OpenUrlOperationParameters {
  string url = 1;
}

message ApplyBrowserPolicyOperationParameters {
  string policy_id = 1;
  int64 policy_version = 2;
  bool implicit_unrestricted = 3;
  BrowserPolicyMode mode = 4;
  BrowserPolicyAccountScope account_scope = 5;
  repeated BrowserPolicyRuleParameters rules = 6;
}

message ApplyBrowserDownloadPolicyOperationParameters {
  string policy_id = 1;
  int64 policy_version = 2;
  bool implicit_no_special_restrictions = 3;
  BrowserDownloadRestrictionMode restriction_mode = 4;
  BrowserPolicyAccountScope account_scope = 5;
}

message BrowserPolicyRuleParameters {
  string rule_id = 1;
  BrowserPolicyRuleAction action = 2;
  BrowserPolicyRuleMatchType match_type = 3;
  string pattern = 4;
  bool enabled = 5;
}

message OperationAccepted {
  string operation_id = 1;
  NetworkOperationType operation_type = 2;
  string target_device_id = 3;
  string protocol_version = 4;
  OperationAcceptanceStatus status = 5;
  int64 accepted_at_unix_ms = 6;
}

message OperationResult {
  string operation_id = 1;
  NetworkOperationType operation_type = 2;
  string target_device_id = 3;
  string protocol_version = 4;
  OperationExecutionStatus status = 5;
  NetworkOperationErrorCode error_code = 6;
  string message = 7;
  int64 started_at_unix_ms = 8;
  int64 completed_at_unix_ms = 9;

  oneof result_details {
    WindowsSessionStateResult windows_session_state = 20;
  }
}

message WindowsSessionStateResult {
  WindowsSessionState state = 1;
}

message OperationStatusQuery {
  string protocol_version = 1;
  string operation_id = 2;
  string target_device_id = 3;
}

message OperationStatusReport {
  string protocol_version = 1;
  string operation_id = 2;
  string target_device_id = 3;
  OperationStatusKnowledge knowledge = 4;
  OperationResult result = 5;
}

enum NetworkCapability {
  NETWORK_CAPABILITY_UNSPECIFIED = 0;
  NETWORK_CAPABILITY_HEARTBEAT_V1 = 1;
  NETWORK_CAPABILITY_OPERATION_FRAMEWORK_V1 = 2;
  NETWORK_CAPABILITY_SESSION_AGENT_AVAILABLE = 3;
  NETWORK_CAPABILITY_POWER_CONTROL_V1 = 4;
  NETWORK_CAPABILITY_OPEN_URL_V1 = 5;
  NETWORK_CAPABILITY_BROWSER_NAVIGATION_POLICY_V1 = 6;
  NETWORK_CAPABILITY_BROWSER_DOWNLOAD_POLICY_V1 = 7;
  NETWORK_CAPABILITY_OPEN_APPLICATION_V1 = 8;
  NETWORK_CAPABILITY_INPUT_CONTROL_V1 = 9;
  NETWORK_CAPABILITY_WINDOWS_SESSION_STATE_V1 = 10;
  NETWORK_CAPABILITY_MANAGED_CREDENTIAL_PROVISIONING_V1 = 11;
  NETWORK_CAPABILITY_WINDOWS_SESSION_LOGOFF_V1 = 12;
  NETWORK_CAPABILITY_WINDOWS_SESSION_LOGON_V1 = 13;
}

enum NetworkOperationType {
  NETWORK_OPERATION_TYPE_UNSPECIFIED = 0;
  NETWORK_OPERATION_TYPE_LOCK_INPUT = 1;
  NETWORK_OPERATION_TYPE_UNLOCK_INPUT = 2;
  NETWORK_OPERATION_TYPE_SHUTDOWN = 3;
  NETWORK_OPERATION_TYPE_RESTART = 4;
  NETWORK_OPERATION_TYPE_OPEN_APPLICATION = 5;
  NETWORK_OPERATION_TYPE_OPEN_URL = 6;
  NETWORK_OPERATION_TYPE_START_PROJECTION = 7;
  NETWORK_OPERATION_TYPE_STOP_PROJECTION = 8;
  NETWORK_OPERATION_TYPE_DISTRIBUTE_FILE = 9;
  NETWORK_OPERATION_TYPE_CREATE_FOLDER = 10;
  NETWORK_OPERATION_TYPE_SET_WALLPAPER = 11;
  NETWORK_OPERATION_TYPE_RESTORE_WALLPAPER = 12;
  NETWORK_OPERATION_TYPE_GET_WINDOWS_SESSION_STATE = 13;
  NETWORK_OPERATION_TYPE_LOGON_MANAGED_ACCOUNT = 14;
  NETWORK_OPERATION_TYPE_LOGOFF_WINDOWS_SESSION = 15;
  NETWORK_OPERATION_TYPE_SWITCH_MANAGED_ACCOUNT = 16;
  NETWORK_OPERATION_TYPE_APPLY_BROWSER_NAVIGATION_POLICY = 17;
  NETWORK_OPERATION_TYPE_APPLY_BROWSER_DOWNLOAD_POLICY = 18;
  NETWORK_OPERATION_TYPE_PROVISION_MANAGED_CREDENTIAL = 19;
}

enum ManagedWindowsAccountId {
  MANAGED_WINDOWS_ACCOUNT_ID_UNSPECIFIED = 0;
  MANAGED_WINDOWS_ACCOUNT_ID_PRIMARY = 1;
  MANAGED_WINDOWS_ACCOUNT_ID_SECONDARY = 2;
}

enum BrowserPolicyMode {
  BROWSER_POLICY_MODE_UNSPECIFIED = 0;
  BROWSER_POLICY_MODE_UNRESTRICTED = 1;
  BROWSER_POLICY_MODE_BLOCKLIST = 2;
  BROWSER_POLICY_MODE_ALLOWLIST = 3;
}

enum BrowserPolicyAccountScope {
  BROWSER_POLICY_ACCOUNT_SCOPE_UNSPECIFIED = 0;
  BROWSER_POLICY_ACCOUNT_SCOPE_ANY = 1;
  BROWSER_POLICY_ACCOUNT_SCOPE_PRIMARY = 2;
  BROWSER_POLICY_ACCOUNT_SCOPE_SECONDARY = 3;
}

enum BrowserDownloadRestrictionMode {
  BROWSER_DOWNLOAD_RESTRICTION_MODE_UNSPECIFIED = 0;
  BROWSER_DOWNLOAD_RESTRICTION_MODE_NO_SPECIAL_RESTRICTIONS = 1;
  BROWSER_DOWNLOAD_RESTRICTION_MODE_BLOCK_DANGEROUS = 2;
  BROWSER_DOWNLOAD_RESTRICTION_MODE_BLOCK_POTENTIALLY_DANGEROUS = 3;
  BROWSER_DOWNLOAD_RESTRICTION_MODE_BLOCK_ALL = 4;
  BROWSER_DOWNLOAD_RESTRICTION_MODE_BLOCK_MALICIOUS = 5;
}

enum WindowsSessionState {
  WINDOWS_SESSION_STATE_UNSPECIFIED = 0;
  WINDOWS_SESSION_STATE_NO_SESSION = 1;
  WINDOWS_SESSION_STATE_PRIMARY_ACTIVE = 2;
  WINDOWS_SESSION_STATE_SECONDARY_ACTIVE = 3;
  WINDOWS_SESSION_STATE_OTHER_SESSION_ACTIVE = 4;
  WINDOWS_SESSION_STATE_UNKNOWN = 5;
}

enum BrowserPolicyRuleAction {
  BROWSER_POLICY_RULE_ACTION_UNSPECIFIED = 0;
  BROWSER_POLICY_RULE_ACTION_ALLOW = 1;
  BROWSER_POLICY_RULE_ACTION_BLOCK = 2;
}

enum BrowserPolicyRuleMatchType {
  BROWSER_POLICY_RULE_MATCH_TYPE_UNSPECIFIED = 0;
  BROWSER_POLICY_RULE_MATCH_TYPE_HOST_EXACT = 1;
  BROWSER_POLICY_RULE_MATCH_TYPE_HOST_SUFFIX = 2;
  BROWSER_POLICY_RULE_MATCH_TYPE_URL_PREFIX = 3;
  BROWSER_POLICY_RULE_MATCH_TYPE_EXACT_URL = 4;
}

enum OperationAcceptanceStatus {
  OPERATION_ACCEPTANCE_STATUS_UNSPECIFIED = 0;
  OPERATION_ACCEPTANCE_STATUS_ACCEPTED = 1;
  OPERATION_ACCEPTANCE_STATUS_REJECTED = 2;
}

enum OperationExecutionStatus {
  OPERATION_EXECUTION_STATUS_UNSPECIFIED = 0;
  OPERATION_EXECUTION_STATUS_SUCCESS = 1;
  OPERATION_EXECUTION_STATUS_FAILED = 2;
  OPERATION_EXECUTION_STATUS_TIMED_OUT = 3;
}

enum OperationStatusKnowledge {
  OPERATION_STATUS_KNOWLEDGE_UNSPECIFIED = 0;
  OPERATION_STATUS_KNOWLEDGE_KNOWN = 1;
  OPERATION_STATUS_KNOWLEDGE_UNKNOWN = 2;
}

enum NetworkOperationErrorCode {
  NETWORK_OPERATION_ERROR_CODE_UNSPECIFIED = 0;
  NETWORK_OPERATION_ERROR_CODE_OPERATION_NOT_IMPLEMENTED = 1;
  NETWORK_OPERATION_ERROR_CODE_OPERATION_DUPLICATE = 2;
  NETWORK_OPERATION_ERROR_CODE_OPERATION_TIMEOUT = 3;
  NETWORK_OPERATION_ERROR_CODE_OPERATION_REJECTED = 4;
  NETWORK_OPERATION_ERROR_CODE_PROTOCOL_VIOLATION = 5;
  NETWORK_OPERATION_ERROR_CODE_POWER_CONTROL_UNAVAILABLE = 6;
  NETWORK_OPERATION_ERROR_CODE_POWER_CONTROL_FAILED = 7;
  NETWORK_OPERATION_ERROR_CODE_INVALID_URL = 8;
  NETWORK_OPERATION_ERROR_CODE_SESSION_AGENT_UNAVAILABLE = 9;
  NETWORK_OPERATION_ERROR_CODE_SESSION_CHANNEL_UNAUTHORIZED = 10;
  NETWORK_OPERATION_ERROR_CODE_SESSION_CHANNEL_PROTOCOL_MISMATCH = 11;
  NETWORK_OPERATION_ERROR_CODE_SESSION_CHANNEL_INVALID_RESPONSE = 12;
  NETWORK_OPERATION_ERROR_CODE_SESSION_COMMAND_RESULT_UNKNOWN = 13;
  NETWORK_OPERATION_ERROR_CODE_URL_LAUNCH_FAILED = 14;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_INVALID = 15;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_NOT_NATIVE_ENFORCEABLE = 16;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_TOO_LARGE = 17;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_USER_UNAVAILABLE = 18;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_ACCOUNT_SCOPE_UNRESOLVED = 19;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_USER_HIVE_UNAVAILABLE = 20;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_EXTERNAL_CONFLICT = 21;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_APPLY_FAILED = 22;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_ROLLBACK_FAILED = 23;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_POLICY_RECOVERY_REQUIRED = 24;
  NETWORK_OPERATION_ERROR_CODE_URL_BLOCKED_BY_POLICY = 25;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_DOWNLOAD_POLICY_INVALID = 26;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_DOWNLOAD_POLICY_EXTERNAL_CONFLICT = 27;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_DOWNLOAD_POLICY_APPLY_FAILED = 28;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_DOWNLOAD_POLICY_ROLLBACK_FAILED = 29;
  NETWORK_OPERATION_ERROR_CODE_BROWSER_DOWNLOAD_POLICY_RECOVERY_REQUIRED = 30;
  NETWORK_OPERATION_ERROR_CODE_APPLICATION_BINDINGS_INVALID = 31;
  NETWORK_OPERATION_ERROR_CODE_APPLICATION_BINDING_NOT_FOUND = 32;
  NETWORK_OPERATION_ERROR_CODE_APPLICATION_BINDING_INVALID = 33;
  NETWORK_OPERATION_ERROR_CODE_APPLICATION_DISABLED = 34;
  NETWORK_OPERATION_ERROR_CODE_APPLICATION_EXECUTABLE_NOT_FOUND = 35;
  NETWORK_OPERATION_ERROR_CODE_APPLICATION_LAUNCH_FAILED = 36;
  NETWORK_OPERATION_ERROR_CODE_INPUT_LOCK_FAILED = 37;
  NETWORK_OPERATION_ERROR_CODE_INPUT_UNLOCK_FAILED = 38;
  NETWORK_OPERATION_ERROR_CODE_MANAGED_ACCOUNT_BINDINGS_INVALID = 39;
  NETWORK_OPERATION_ERROR_CODE_WINDOWS_SESSION_UNKNOWN = 40;
  NETWORK_OPERATION_ERROR_CODE_ACCOUNT_NOT_CONFIGURED = 41;
  NETWORK_OPERATION_ERROR_CODE_ACCOUNT_NOT_FOUND = 42;
  NETWORK_OPERATION_ERROR_CODE_MANAGED_CREDENTIAL_STORE_INVALID = 43;
  NETWORK_OPERATION_ERROR_CODE_MANAGED_CREDENTIAL_PROTECTION_FAILED = 44;
  NETWORK_OPERATION_ERROR_CODE_WINDOWS_SESSION_CHANGED = 45;
  NETWORK_OPERATION_ERROR_CODE_WINDOWS_LOGOFF_FAILED = 46;
  NETWORK_OPERATION_ERROR_CODE_MANAGED_CREDENTIAL_NOT_CONFIGURED = 47;
  NETWORK_OPERATION_ERROR_CODE_WINDOWS_LOGON_FAILED = 48;
  NETWORK_OPERATION_ERROR_CODE_CREDENTIAL_PROVIDER_UNAVAILABLE = 49;
  NETWORK_OPERATION_ERROR_CODE_WINDOWS_LOGON_BUSY = 50;
  NETWORK_OPERATION_ERROR_CODE_WINDOWS_LOGON_NOT_CONFIRMED = 51;
}
